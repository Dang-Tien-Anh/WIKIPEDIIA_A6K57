<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false">Menu</button>
    <a class="brand" href="#/"><span id="siteTitle">My Wiki</span></a>
    <form id="searchForm" class="search" role="search">
      <input id="searchInput" type="search" placeholder="Search this wiki" aria-label="Search this wiki" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>

  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="Wiki navigation">
      <p id="tagline" class="tagline"></p>
      <ul class="nav-list">
        <li><a href="#/">Main page</a></li>
        <li><a href="#/all">All articles</a></li>
        <li><a href="#/random">Random article</a></li>
      </ul>
      <h2>Categories</h2>
      <ul id="catList" class="nav-list"></ul>
    </nav>
    <main id="view" class="view" tabindex="-1">Loading…</main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
