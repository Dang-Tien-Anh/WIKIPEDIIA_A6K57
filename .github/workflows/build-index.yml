name: Update article index
on:
  push:
    paths:
      - "articles/*.md"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index.js
      - name: Commit index if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add articles/index.json
          git diff --staged --quiet || (git commit -m "Update article index" && git push)
